plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brainpal.clone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.brainpal.clone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No third-party dependencies: framework APIs only, so the build is fast and
// reproducible without a network round-trip for AndroidX/Compose artifacts.
